      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json biyoueki.html pack.html cosme.html beauty-device.html haircare.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update products and category pages"
            git push
          fi
