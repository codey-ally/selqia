name: Update Rakuten Products

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Rakuten products
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          params = {
              "applicationId": os.environ["RAKUTEN_APP_ID"],
              "accessKey": os.environ["RAKUTEN_ACCESS_KEY"],
              "affiliateId": os.environ["RAKUTEN_AFFILIATE_ID"],
              "keyword": "美容液",
              "format": "json",
              "hits": "30",
              "page": "1"
          }

          url = (
              "https://openapi.rakuten.co.jp/"
              "ichibams/api/IchibaItem/Search/20260701?"
              + urllib.parse.urlencode(params)
          )

          request = urllib.request.Request(
    url,
    headers={
        "User-Agent": "SELQIAN",
        "Origin": "https://codey-ally.github.io",
        "Referer": "https://codey-ally.github.io/selqia/"
    }
)

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

          except urllib.error.HTTPError as e:
              print("Rakuten API error:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise

          with open("products.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          items = data.get("Items", [])

          print("Products updated:", len(items))
          PY

      - name: Commit products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Rakuten products"
            git push
          fi
