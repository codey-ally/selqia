name: Generate SEO Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-seo-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SEO pages
        run: |
          python - <<'PY'
          import json
          import html

          pages = {
              "美容液 おすすめ": "serum-recommend.html",
              "韓国美容液 おすすめ": "korean-serum.html",
              "毛穴 美容液": "pore-serum.html",
              "乾燥 美容液": "dry-skin-serum.html",
              "フェイスパック おすすめ": "face-pack-recommend.html",
              "韓国コスメ おすすめ": "korean-cosme.html",
              "美容家電 おすすめ": "beauty-device-recommend.html",
              "ヘアケア おすすめ": "haircare-recommend.html"
          }

          with open("products.json", encoding="utf-8") as f:
              data = json.load(f)

          products = data.get("items", [])

          for keyword, filename in pages.items():

              cards = ""

              for p in products[:20]:

                  name = html.escape(
                      p.get("itemName", "商品")
                  )

                  price = f'{int(p.get("itemPrice", 0)):,}'

                  image = ""

                  if p.get("mediumImageUrls"):
                      image = p["mediumImageUrls"][0].get(
                          "imageUrl", ""
                      )

                  url = html.escape(
                      p.get("affiliateUrl")
                      or p.get("itemUrl")
                      or "#"
                  )

                  cards += f"""
                  <a class="card"
                     href="{url}"
                     target="_blank"
                     rel="noopener noreferrer">

                    <img src="{image}" alt="{name}">

                    <div>
                      <h2>{name}</h2>
                      <p>¥{price}</p>
                      <span>楽天市場で見る →</span>
                    </div>

                  </a>
                  """

              page = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <title>{keyword}｜SELQIAN</title>

            <meta name="description"
                  content="{keyword}を探している人向けに、SELQIANが楽天市場の商品をチェックしやすくまとめています。">

            <style>
              * {{
                box-sizing: border-box;
              }}

              body {{
                margin: 0;
                background: #fafafa;
                color: #222;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Noto Sans JP",
                  sans-serif;
              }}

              header {{
                padding: 22px;
                background: white;
                text-align: center;
                border-bottom: 1px solid #eee;
              }}

              .logo {{
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 2px;
              }}

              main {{
                max-width: 1100px;
                margin: auto;
                padding: 35px 20px 60px;
              }}

              .hero {{
                text-align: center;
                padding: 20px 10px 35px;
              }}

              .hero h1 {{
                font-size: 28px;
              }}

              .hero p {{
                color: #777;
              }}

              .products {{
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
              }}

              .card {{
                display: flex;
                gap: 15px;
                padding: 15px;
                background: white;
                border-radius: 16px;
                color: #333;
                text-decoration: none;
                box-shadow:
                  0 4px 15px rgba(0,0,0,.06);
              }}

              .card img {{
                width: 110px;
                height: 110px;
                object-fit: contain;
                flex-shrink: 0;
              }}

              .card h2 {{
                font-size: 14px;
                line-height: 1.5;
                margin: 0;
              }}

              .card p {{
                font-weight: bold;
              }}

              .card span {{
                font-size: 12px;
              }}

              @media (max-width: 600px) {{
                .products {{
                  grid-template-columns: 1fr;
                }}
              }}
            </style>
          </head>

          <body>

          <header>
            <div class="logo">SELQIAN</div>
          </header>

          <main>

            <section class="hero">
              <h1>{keyword}</h1>
              <p>
                SELQIANで気になる美容アイテムをチェック。
              </p>
            </section>

            <section class="products">
              {cards}
            </section>

          </main>

          </body>
          </html>
          """

              with open(filename, "w", encoding="utf-8") as f:
                  f.write(page)

              print("Generated:", filename)
          PY

      - name: Commit SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate SEO pages"
            git push
          fi
