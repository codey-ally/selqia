<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELQIA｜買う前に、選びやすく。</title>
  <meta name="description" content="美容アイテムを比較して、自分に合う商品を見つけるためのサイト。">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #fafafa;
      color: #222;
      line-height: 1.7;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero p {
      color: #666;
      font-size: 16px;
      max-width: 600px;
    }

    .categories {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .categories h2 {
      margin-bottom: 20px;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .category {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      font-weight: 600;
    }

    .products {
      max-width: 1100px;
      margin: 0 auto 80px;
      padding: 0 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .product {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 25px;
    }

    .product-image {
      height: 180px;
      background: #f1f1f1;
      border-radius: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      color: #666;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .category-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SELQIA</div>
    <nav>
      <a href="#">TOP</a>
      <a href="#categories">CATEGORY</a>
      <a href="#products">PICK UP</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1>買う前に、<br>選びやすく。</h1>
    <p>
      SELQIAは、美容アイテムを比較して、
      自分に合う商品を見つけるためのサイトです。
    </p>
  </section>

  <section class="categories" id="categories">
    <h2>Category</h2>

    <div class="category-list">
      <div class="category">スキンケア</div>
      <div class="category">コスメ</div>
      <div class="category">美容家電</div>
      <div class="category">ヘアケア</div>
    </div>
  </section>

  <section class="products" id="products">
    <h2>Pick Up</h2>

    <div class="product-grid">

      <article class="product">
        <div class="product-image">PRODUCT</div>
        <h3>おすすめ美容アイテム</h3>
        <p>
          商品情報や特徴を比較して、
          自分に合うアイテムを探せます。
        </p>
        <a href="#" class="button">楽天で見る</a>
      </article>

      <article class="product">
        <div class="product-image">PRODUCT</div>
        <h3>人気スキンケア</h3>
        <p>
          人気の商品を比較しながら
          お気に入りを見つけよう。
        </p>
        <a href="#" class="button">楽天で見る</a>
      </article>

      <article class="product">
        <div class="product-image">PRODUCT</div>
        <h3>美容家電</h3>
        <p>
          気になる美容家電を
          まとめてチェック。
        </p>
        <a href="#" class="button">楽天で見る</a>
      </article>

    </div>
  </section>

</main>

<footer>
  © SELQIA
</footer>

</body>
</html>
