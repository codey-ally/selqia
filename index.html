<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELQIAN｜美容アイテムを探す</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #fafafa;
      color: #222;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .sub {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(135deg, #fff, #f7f1f5);
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.4;
    }

    .hero p {
      color: #777;
      margin: 14px 0 0;
    }

    .search {
      max-width: 600px;
      margin: 25px auto 0;
      display: flex;
      gap: 8px;
    }

    .search input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
    }

    .search button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: white;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fff;
    }

    .info {
      padding: 15px;
    }

    .name {
      font-size: 14px;
      line-height: 1.5;
      min-height: 42px;
    }

    .price {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 800;
    }

    .button {
      display: block;
      margin-top: 12px;
      padding: 11px;
      text-align: center;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    footer {
      padding: 30px;
      text-align: center;
      background: white;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">SELQIAN</div>
  <div class="sub">美容アイテムを、もっと選びやすく。</div>
</header>

<section class="hero">
  <h1>欲しい美容アイテムを<br>かんたんに見つける</h1>
  <p>楽天市場の美容アイテムをチェック</p>

  <div class="search">
    <input id="keyword" type="text" placeholder="美容液・パック・ヘアケアなど">
    <button onclick="searchProducts()">検索</button>
  </div>
</section>

<main>
  <h2 class="section-title">おすすめ美容アイテム</h2>

  <div id="products">
    <div class="loading">商品を読み込んでいます…</div>
  </div>
</main>

<footer>
  © SELQIAN
</footer>

<script>
  async function loadProducts(keyword = "美容液") {
    const container = document.getElementById("products");

    try {
      const response = await fetch("products.json");

      if (!response.ok) {
        throw new Error("products.json not found");
      }

      const data = await response.json();

      const products = data.items || [];

      if (products.length === 0) {
        container.innerHTML =
          '<div class="empty">商品が見つかりませんでした。</div>';
        return;
      }

      container.innerHTML = products.map(item => {

        const image =
          item.mediumImageUrls?.[0]?.imageUrl ||
          item.smallImageUrls?.[0]?.imageUrl ||
          "";

        const name = item.itemName || "商品名なし";
        const price = Number(item.itemPrice || 0).toLocaleString();
        const url = item.affiliateUrl || item.itemUrl || "#";

        return `
          <article class="card">
            <img src="${image}" alt="${name}">
            <div class="info">
              <div class="name">${name}</div>
              <div class="price">¥${price}</div>
              <a class="button"
                 href="${url}"
                 target="_blank"
                 rel="noopener noreferrer">
                楽天市場で見る
              </a>
            </div>
          </article>
        `;
      }).join("");

    } catch (error) {
      container.innerHTML =
        '<div class="empty">商品データを準備中です。</div>';
    }
  }

  function searchProducts() {
    const keyword = document.getElementById("keyword").value.trim();

    if (!keyword) {
      loadProducts();
      return;
    }

    // 次の自動取得システム完成後、
    // キーワード検索にも対応させます。
    loadProducts(keyword);
  }

  loadProducts();
</script>

</body>
</html>
